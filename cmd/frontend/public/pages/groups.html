<div class="page">
	<h1>Групповой отчет</h1>
	<div>
		<form id="group-search-form">
			<label for="institute">Институт</label>
			<input list="institutes" id="institute" name="institute" required />
			<datalist id="institutes">
				<option value="ИЦС">ИЦС</option>
				<option value="ИИИМ">ИИИМ</option>
				<option value="АСТ">АСТ</option>
				<option value="ИХТ">ИХТ</option>
			</datalist>

			<label for="year">Год</label>
			<input
				id="year"
				name="year"
				type="number"
				min="2000"
				max="2100"
				required
			/>

			<label for="half">Весна/Осень</label>
			<input list="halfs" id="half" name="half" required />
			<datalist id="halfs">
				<option value="Весна">Весна</option>
				<option value="Осень">Осень</option>
			</datalist>

			<button type="submit">Поиск</button>
			<span id="search-status"></span>
		</form>
	</div>
	<div class="table-container">
		<table>
			<thead>
				<tr>
					<th title="Уникальный номер записи в базе">ID</th>
					<th title="Институт(ЦСЭМ/ИИИМ и т.д.)">Институт</th>
					<th title="Учебная группа">Группа</th>
					<th title="ФИО старосты">Староста</th>
					<th title="Количество студентов по спискам">Студентов (список)</th>
					<th title="Фактическое количество студентов">Студентов (факт)</th>
					<th title="Количество студентов, не прошедших замер">Пропущено</th>
					<th title="Качество замера. Прошедшие студенты/Все студенты">
						Качество
					</th>
					<th title="Дата проведения замера">Дата замера</th>
					<th title="Отметка Староста был до/после/не был">Староста был</th>
				</tr>
			</thead>
			<tbody id="group-table-body">
				<tr>
					<td colspan="10">Загрузка данных...</td>
				</tr>
			</tbody>
		</table>
	</div>
</div>
